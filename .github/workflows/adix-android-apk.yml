name: Build ADIX Godot Android APK

on:
  push:
    paths:
      - "ADIX-GODOT-BATTLE-ROYALE/**"
      - ".github/workflows/adix-android-apk.yml"
      - ".github/workflows/adix-battle-royale-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adix-godot-android-build
  cancel-in-progress: true

jobs:
  export-android:
    name: Export Godot Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          # sdkmanager can close stdin after accepting all licenses; avoid
          # treating yes(1)'s expected SIGPIPE as a build failure.
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/bin/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP/godot/bin/Godot_v4.4.1-stable_linux.x86_64"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q -j "$RUNNER_TEMP/godot/templates.tpz" -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"

      - name: Validate Godot project
        shell: bash
        run: |
          set -euxo pipefail
          "$GODOT_BIN" --headless --path ADIX-GODOT-BATTLE-ROYALE --editor --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ADIX-GODOT-BATTLE-ROYALE/build
          "$GODOT_BIN" --headless --path ADIX-GODOT-BATTLE-ROYALE --export-debug Android ADIX-GODOT-BATTLE-ROYALE/build/ADIX-BATTLE-ROYALE-debug.apk
          test -s ADIX-GODOT-BATTLE-ROYALE/build/ADIX-BATTLE-ROYALE-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADIX-BATTLE-ROYALE-Android-APK
          path: ADIX-GODOT-BATTLE-ROYALE/build/ADIX-BATTLE-ROYALE-debug.apk
          if-no-files-found: error
          retention-days: 14
