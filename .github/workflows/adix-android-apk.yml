name: Build ADIX Android APK

on:
  push:
    paths:
      - "ADIX-GODOT-BATTLE-ROYALE/**"
      - ".github/workflows/adix-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android APK with Godot
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          relative_project_path: ADIX-GODOT-BATTLE-ROYALE
          export_debug: true
          presets_to_export: Android
          use_preset_export_path: true
          cache: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADIX-BATTLE-ROYALE-Android-APK
          path: ${{ steps.export.outputs.build_directory }}/Android/*.apk
          if-no-files-found: error
          retention-days: 14
