name: ADIX BATTLE ROYALE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ADIX-BATTLE-ROYALE/**"
      - ".github/workflows/adix-battle-royale-android.yml"

permissions:
  contents: read

jobs:
  build-android-demo:
    name: Build Android Demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ADIX-BATTLE-ROYALE
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: AdixBattleRoyale.Editor.AndroidDemoBuild.BuildAndroidDemo
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADIX-BATTLE-ROYALE-Android-Demo
          path: ADIX-BATTLE-ROYALE/Builds/Android/*.apk
          if-no-files-found: error
          retention-days: 14
