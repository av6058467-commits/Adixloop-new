name: ADIX BATTLE ROYALE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ADIX-BATTLE-ROYALE/**"
      - ".github/workflows/adix-battle-royale-android.yml"

permissions:
  contents: read

concurrency:
  group: adix-android-build
  cancel-in-progress: true

jobs:
  build-android-demo:
    name: Build Android Demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity Cloud Build secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing GitHub Secret::Repository secret $key is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Open Repository Settings > Secrets and variables > Actions and add the missing Unity secrets. Never paste secret values into chat or commit them."
            exit 1
          fi
          echo "Unity build secrets are present."

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ADIX-BATTLE-ROYALE
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: AdixBattleRoyale.Editor.AndroidDemoBuild.BuildAndroidDemo
          androidAppBundle: false
          allowDirtyBuild: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADIX-BATTLE-ROYALE-Android-Demo
          path: ADIX-BATTLE-ROYALE/Builds/Android/*.apk
          if-no-files-found: error
          retention-days: 14
